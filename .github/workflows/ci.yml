name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate manifest.json
        run: |
          jq -e '.manifest_version == 3 and (.version | type == "string")' manifest.json

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Scan for committed secrets
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact -v .

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package extension
        run: |
          files="manifest.json index.html styles.css background.js maps-content.js src vendor"
          [ -d icons ] && files="$files icons"
          zip -r "crowsnest-${GITHUB_REF_NAME}.zip" $files
      - uses: softprops/action-gh-release@v2
        with:
          files: crowsnest-*.zip
          generate_release_notes: true
